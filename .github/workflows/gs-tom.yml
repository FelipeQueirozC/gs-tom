name: Daily GS ToM Downloader

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gs-tom-downloader
  cancel-in-progress: false

jobs:
  download-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run downloader
        id: downloader
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DELIVERY_CHAT_ID: ${{ secrets.TELEGRAM_DELIVERY_CHAT_ID }}
          TELEGRAM_ERROR_CHAT_ID: ${{ secrets.TELEGRAM_ERROR_CHAT_ID }}
        run: |
          set +e
          python gs_tom.py --state gs_top_of_mind_state.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_top_of_mind_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GS ToM state"
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Fail if downloader failed
        if: steps.downloader.outputs.status != '0'
        run: exit 1
